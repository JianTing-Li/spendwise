name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      INVESTIGATOR_MODE: stub
      DATABASE_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run eval:baseline
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendwise_app01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spendwise_app01_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_ALLOW_LOCAL: "1"
      PG_TEST_HOST: "127.0.0.1"
      PG_TEST_PORT: "5432"
      PG_TEST_DATABASE: spendwise_app01_test
      PG_TEST_USER: postgres
      PG_TEST_PASSWORD: postgres
      INVESTIGATOR_MODE: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run test:pg
